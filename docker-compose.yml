version: '3.8'

services:
  backend:
    build: 
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - fastembed_cache:/root/.cache/fastembed
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app

  frontend:
    build:
      context: ./frontend
    ports:
      - "8501:8501"
    depends_on:
      - backend
    environment:
      - API_URL=http://backend:8000/api/v1/research/query

volumes:
  fastembed_cache: